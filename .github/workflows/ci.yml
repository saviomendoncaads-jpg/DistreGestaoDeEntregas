name: CI

on:
  push:
    branches: [ main, master, develop, 'feat/**', 'codex/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — typecheck + testes
    # Stack usa msnodesqlv8 (binding nativo Windows) + SQL Server Express.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Testes (vitest)
        run: npm test

  frontend:
    name: Frontend — bundle de produção
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Bundle (Vite)
        run: npm run build
